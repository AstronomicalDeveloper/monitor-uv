appId: io.github.astronomicaldeveloper.monitoruv
productName: Monitor Ambiental UV
directories:
  buildResources: build
files:
  - 'out/**'
  - 'resources/**'
  - 'LICENSE'
  - '!**/database*.json'
  - '!**/.env'
  - '!**/.env.*'
  - '!**/.npmrc'
  - '!**/*.zip'
asarUnpack:
  - resources/**
win:
  executableName: monitor-uv
nsis:
  artifactName: ${name}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
mac:
  notarize: false
dmg:
  artifactName: ${name}-${version}.${ext}
linux:
  target:
    - AppImage
    - snap
    - deb
  maintainer: Landry Bardales Guadalupe
  category: Utility
appImage:
  artifactName: ${name}-${version}.${ext}
npmRebuild: false
publish: null
